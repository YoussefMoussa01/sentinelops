# Alembic configuration file

[alembic]
# Path to migration scripts
sqlalchemy.url = driver://user:password@localhost/dbname
script_location = app/database/migrations

# Template location for new revisions
file_template = %%(rev)s_%%(slug)s

# Timezone for datetime comparisons
sqlalchemy_echo = False

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
